# Cấu hình siêu tham số cho mô hình ResNet-18 (train from scratch)
# - model_name: resnet18
# - pretrained: false (bắt buộc train từ đầu)
# - age_mode: coral (Kiểu B - CORAL 8 ngưỡng) hoặc multiclass (Kiểu A - CrossEntropy 9 lớp)
# - img_size: 224
# - epochs: 30

model : resnet18
pretrained : false
age_mode : coral
img_size : 224
epochs : 30
batch_size : 64
lr : 0.001
augment : true
vflip : false
w_gender : 1.0
w_age : 3.0
save_dir : checkpoints
